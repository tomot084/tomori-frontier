<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#277c80" />
    <title>灯芽の開拓者 | Tomori Frontier</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232c8183'/%3E%3Cpath d='m16 5 3 8 8 3-8 3-3 8-3-8-8-3 8-3' fill='%23ffe4a0'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="game">
      <canvas id="scene" aria-label="灯芽の開拓者 3Dゲームフィールド"></canvas>
    </div>
    <div id="world-ui" aria-hidden="true"></div>
    <div id="hud">
      <div class="hud-heading">
        <span class="wordmark"><i>✦</i> TOMORI <b>FRONTIER</b></span
        ><span id="chapter">島 1 / 3</span>
      </div>
      <div id="resources"></div>
      <div class="vitals">
        <span class="heart">♥</span>
        <div class="health"><i id="hp"></i></div>
        <b id="hp-value">80 / 80</b>
      </div>
      <div class="objective">
        <span class="objective-icon">✦</span>
        <div id="goal"></div>
      </div>
    </div>
    <button id="settings" aria-label="設定">
      <svg viewBox="0 0 24 24">
        <path
          d="m10 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-2v-3l3-2-1-3-3-1-1-3Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle
          cx="12"
          cy="12"
          r="3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </svg>
    </button>
    <div id="stick" aria-hidden="true"><div></div></div>
    <div id="toast" role="status"></div>
    <div id="unlock" role="status" hidden></div>
    <span id="save-status">この端末に自動保存</span>
    <div id="shop" hidden>
      <button id="shop-toggle">
        <span>✦</span><b>工房を開く</b><small>装備を強化</small>
      </button>
      <section id="shop-panel" hidden>
        <header>
          <div>
            <small>LANTERN WORKSHOP</small>
            <h2>灯工房</h2>
          </div>
          <button id="shop-close" aria-label="工房を閉じる">×</button>
        </header>
        <p>灯貨で装備を強化。ここでは時間が止まります。</p>
        <div id="upgrades"></div>
      </section>
    </div>
    <div id="intro" class="overlay">
      <section>
        <div class="intro-emblem"><span>✦</span></div>
        <small class="eyebrow">TOMORI FRONTIER</small>
        <h1>灯芽の開拓者</h1>
        <p class="intro-story">
          霧に眠る三つの浮島。<br />小さな灯守と、もう一度光をつなごう。
        </p>
        <div class="intro-path">
          <span>集める</span><i>→</i><span>つくる</span><i>→</i
          ><span>ひらく</span>
        </div>
        <button id="start" disabled>島へ降りる <span>↗</span></button>
        <p id="loading">島に灯りをともしています…</p>
        <small class="intro-controls"
          >スマホはフィールドをドラッグ · PCはWASD / 矢印<br />採集も戦闘も、自動。進行も自動保存。</small
        >
      </section>
    </div>
    <dialog id="config">
      <small class="eyebrow">YOUR JOURNEY</small>
      <h2>旅の設定</h2>
      <p>
        進行はこのブラウザに自動保存されます。<br />続きからいつでも遊べます。
      </p>
      <button id="feedback">音・完成時の振動：ON</button>
      <button id="quality">描画品質：標準</button
      ><button id="reset">セーブデータをリセット</button
      ><button id="close">戻る</button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
